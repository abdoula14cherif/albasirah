<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Catégories — Al Basîrah</title>
<link rel="stylesheet" href="style.css"/>
<style>
.cat-card{background:var(--white);border-radius:var(--r-xl);border:1.5px solid var(--line);padding:2rem 1.2rem;text-align:center;cursor:pointer;transition:all .22s;box-shadow:var(--sh);}
.cat-card:hover{transform:translateY(-5px);box-shadow:var(--sh-h);}
.cat-ico{width:56px;height:56px;border-radius:16px;margin:0 auto .9rem;display:flex;align-items:center;justify-content:center;font-size:1.5rem;}
.cat-ar{font-family:'Noto Naskh Arabic',serif;font-size:1rem;font-weight:700;color:var(--txt);}
.cat-fr{font-size:.67rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.2rem;display:block;}
.cat-cnt{font-size:.72rem;font-weight:800;margin-top:.5rem;display:block;}
</style>
</head>
<body>
<div id="toast"></div>
<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">ب</div>
    <div class="nav-logo-text"><span class="nav-logo-ar">البصيرة</span><span class="nav-logo-fr">Al Basîrah</span></div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">🏠 Accueil</a></li>
    <li><a href="savants.html">👨‍🏫 Savants</a></li>
    <li><a href="bibliotheque.html">📚 Bibliothèque</a></li>
    <li><a href="live.html">📡 En Direct</a></li>
    <li><a href="categories.html" class="active">🏷️ Catégories</a></li>
  </ul>
  <div class="nav-right">
    <button class="btn btn-outline" onclick="location.href='connexion.html'">Connexion</button>
    <button class="btn btn-green" onclick="location.href='inscription.html'">S'inscrire</button>
  </div>
</nav>
<div style="padding:90px 5vw 4rem">
  <div class="page-wrap">
    <div style="font-size:.7rem;color:var(--muted);margin-bottom:1.2rem"><a href="index.html" style="color:var(--b1)">🏠 Accueil</a> › Catégories</div>
    <div style="margin-bottom:2rem"><span class="sec-eyebrow ey-cyan">✦ التصنيفات</span><h1 style="font-size:2rem;font-weight:900;color:var(--txt)">Toutes les <span style="color:var(--c1)">Catégories</span></h1></div>
    <div class="grid-4" id="cats-grid"></div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
const BG = {green:'rgba(29,185,84,.1)',blue:'rgba(33,150,243,.1)',red:'rgba(229,57,53,.09)',cyan:'rgba(0,188,212,.1)'};
const TC = {green:'var(--g1)',blue:'var(--b1)',red:'var(--r1)',cyan:'var(--c1)'};
document.getElementById('cats-grid').innerHTML = CATS.map(c => `
  <div class="cat-card" onclick="location.href='bibliotheque.html?cat=${c.slug}'">
    <div class="cat-ico" style="background:${BG[c.color]}">${c.emoji}</div>
    <p class="cat-ar">${c.label_ar}</p>
    <span class="cat-fr">${c.label_fr}</span>
    <span class="cat-cnt" style="color:${TC[c.color]}">${c.count} contenus</span>
    <button class="btn btn-ghost btn-sm" style="margin-top:.8rem;width:100%" onclick="event.stopPropagation();location.href='bibliotheque.html?cat=${c.slug}'">Parcourir →</button>
  </div>`).join('');
</script>
</body>
</html>
