<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Profil Savant — Al Basîrah</title>
<link rel="stylesheet" href="style.css"/>
<style>
.sc-hero-wrap{background:var(--white);border-bottom:1.5px solid var(--line);padding:90px 5vw 0;}
.sc-hero-inner{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:2rem;align-items:center;padding:1.5rem 0 0;}
.sc-av-big{width:100px;height:100px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Naskh Arabic',serif;font-size:2.5rem;font-weight:700;color:#fff;flex-shrink:0;position:relative;}
.sc-av-big .live-pip{position:absolute;bottom:4px;right:4px;background:var(--r1);border:2px solid var(--white);border-radius:20px;padding:.1rem .4rem;font-size:.58rem;font-weight:800;color:#fff;display:flex;align-items:center;gap:.25rem;}
.sc-name-ar{font-family:'Noto Naskh Arabic',serif;font-size:1.6rem;font-weight:700;color:var(--txt);}
.sc-name-fr{font-size:1rem;font-weight:700;color:var(--sub);margin-top:.15rem;}
.sc-meta-row{display:flex;gap:1rem;flex-wrap:wrap;margin-top:.6rem;}
.sc-meta-item{font-size:.78rem;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:.35rem;}
.sc-tags-row{display:flex;gap:.4rem;flex-wrap:wrap;margin-top:.6rem;}
.sc-actions{grid-column:1/-1;display:flex;gap:.6rem;flex-wrap:wrap;padding:1rem 0;border-top:1.5px solid var(--line);margin-top:.5rem;}

.sc-stats-bar{background:var(--bg);border-bottom:1.5px solid var(--line);padding:.8rem 5vw;}
.sc-stats-inner{max-width:1240px;margin:0 auto;display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap;}
.sc-stat{text-align:center;padding:.4rem .8rem;background:var(--white);border-radius:var(--r-md);border:1.5px solid var(--line);}
.sc-stat-n{font-size:1.2rem;font-weight:900;display:block;}
.sc-stat-l{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}

.main-grid{max-width:1240px;margin:2rem auto;padding:0 5vw;display:grid;grid-template-columns:1fr 280px;gap:1.8rem;align-items:start;}

/* Content area */
.content-box{background:var(--white);border-radius:var(--r-xl);border:1.5px solid var(--line);overflow:hidden;}
.panel-wrap{padding:1.4rem;}
.panel-search{margin-bottom:1.2rem;}

/* Item rows */
.item-row{display:flex;align-items:flex-start;gap:1rem;padding:1rem;border-radius:var(--r-lg);border:1.5px solid var(--line);background:var(--bg);transition:all .2s;margin-bottom:.7rem;cursor:pointer;}
.item-row:hover{background:var(--white);border-color:var(--b1);box-shadow:0 4px 16px rgba(33,150,243,.08);}
.item-row.playing{background:var(--white);border-color:var(--g1);box-shadow:0 4px 16px rgba(29,185,84,.1);}
.item-thumb{width:52px;height:52px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;flex-shrink:0;}
.th-green{background:rgba(29,185,84,.1)} .th-blue{background:rgba(33,150,243,.1)} .th-red{background:rgba(229,57,53,.09)}
.item-info{flex:1;min-width:0;}
.item-title{font-size:.88rem;font-weight:800;color:var(--txt);line-height:1.4;margin-bottom:.3rem;}
.item-meta{font-size:.71rem;font-weight:600;color:var(--muted);display:flex;gap:.8rem;flex-wrap:wrap;}
.item-actions{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;}
.sound-wave{display:none;gap:2px;align-items:center;height:14px;margin-left:.4rem;}
.playing .sound-wave{display:flex;}
.wave-b{width:3px;border-radius:2px;background:var(--g1);animation:wv .7s ease-in-out infinite;}
.wave-b:nth-child(1){height:6px;animation-delay:0s} .wave-b:nth-child(2){height:12px;animation-delay:.1s}
.wave-b:nth-child(3){height:8px;animation-delay:.2s} .wave-b:nth-child(4){height:14px;animation-delay:.3s}
@keyframes wv{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.5)}}

/* Sidebar */
.side-box{background:var(--white);border-radius:var(--r-xl);border:1.5px solid var(--line);overflow:hidden;margin-bottom:1.2rem;}
.side-head{background:var(--bg);padding:.8rem 1.2rem;font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--sub);border-bottom:1.5px solid var(--line);}
.side-body{padding:1rem 1.2rem;}
.bio-text{font-size:.82rem;font-weight:600;color:var(--sub);line-height:1.8;}
.rel-item{display:flex;align-items:center;gap:.75rem;padding:.55rem .4rem;border-radius:var(--r-md);cursor:pointer;transition:background .18s;}
.rel-item:hover{background:var(--bg);}
.rel-av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Noto Naskh Arabic',serif;font-size:.95rem;font-weight:700;color:#fff;flex-shrink:0;}
.rel-name{font-size:.82rem;font-weight:800;color:var(--txt);}
.rel-sub{font-size:.68rem;font-weight:600;color:var(--muted);}
.share-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.5rem;}
.share-btn{font-size:.7rem;font-weight:800;border:none;border-radius:var(--r-md);padding:.55rem .3rem;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:.2rem;}
.share-btn:hover{transform:translateY(-2px);}

@media(max-width:900px){.main-grid{grid-template-columns:1fr} .sc-hero-inner{grid-template-columns:1fr;text-align:center} .sc-av-big{margin:0 auto} .sc-meta-row,.sc-tags-row{justify-content:center} .sc-actions{justify-content:center}}
</style>
</head>
<body>
<div id="toast"></div>

<!-- VIDEO MODAL -->
<div class="modal-overlay" id="video-modal">
  <div class="modal-box">
    <div class="modal-header">
      <p class="modal-title" id="vm-title">—</p>
      <button class="modal-close" onclick="closeVideo()">✕</button>
    </div>
    <div class="modal-body">

        <span style="font-size:3.5rem">🎬</span>
        <span style="color:rgba(255,255,255,.5);font-size:.8rem;font-weight:700">Cliquer pour lancer</span>
      </div>
      <p id="vm-meta" style="font-size:.82rem;font-weight:700;color:var(--muted);margin-bottom:1rem;"></p>
      <p id="vm-desc" style="font-size:.83rem;font-weight:600;color:var(--sub);line-height:1.75;background:var(--bg);padding:.9rem;border-radius:var(--r-md);margin-bottom:1rem;"></p>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap">
        <button class="btn btn-red" onclick="showToast('▶ Lecture démarrée')">▶ Regarder</button>

        <button class="btn btn-ghost" onclick="shareWA(document.getElementById('vm-title').textContent)">WA</button>

      </div>

</div>

<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">ب</div>
    <div class="nav-logo-text"><span class="nav-logo-ar">البصيرة</span><span class="nav-logo-fr">Al Basîrah</span></div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">🏠 Accueil</a></li>
    <li><a href="savants.html" class="active">👨‍🏫 Savants</a></li>
    <li><a href="bibliotheque.html">📚 Bibliothèque</a></li>

</nav>

<!-- SCHOLAR HERO -->
<div class="sc-hero-wrap">
  <div class="sc-hero-inner" id="sc-hero">
    <div style="position:relative">
      <div class="sc-av-big" id="sc-av">—</div>
    </div>
    <div>
      <p class="sc-name-ar" id="sc-name-ar">—</p>
      <p class="sc-name-fr" id="sc-name-fr">—</p>
      <div class="sc-meta-row" id="sc-meta"></div>
      <div class="sc-tags-row" id="sc-tags"></div>
    </div>
    <div class="sc-actions" id="sc-actions"></div>
  </div>
</div>

<!-- STATS BAR -->
<div class="sc-stats-bar">
  <div class="sc-stats-inner" id="sc-stats"></div>
</div>

<!-- MAIN GRID -->
<div class="main-grid">
  <div>
    <div class="content-box">
      <div class="tabs-nav" id="tabs-nav" data-tabs>
        <button class="tab-btn active-green" onclick="activateTab('panel-books',this,'active-green')">📚 Livres <span class="tab-cnt" id="tcnt-books">0</span></button>
        <button class="tab-btn" onclick="activateTab('panel-audio',this,'active-blue')">🎧 Audio <span class="tab-cnt" id="tcnt-audio">0</span></button>
        <button class="tab-btn" onclick="activateTab('panel-video',this,'active-red')">🎬 Vidéos <span class="tab-cnt" id="tcnt-video">0</span></button>
        <button class="tab-btn" onclick="activateTab('panel-bio',this,'active-cyan')">📖 Bio</button>
      </div>

      <div id="panel-books" class="tab-panel active panel-wrap">
        <div class="panel-search"><div class="search-box"><span class="search-ico">🔍</span><input type="text" placeholder="Rechercher un livre…" oninput="filterList('books-list',this.value)"/></div></div>
        <div id="books-list"></div>
      </div>
      <div id="panel-audio" class="tab-panel panel-wrap">

        <div id="audio-list"></div>

      <div id="panel-video" class="tab-panel panel-wrap">

        <div id="video-list"></div>

          <button class="share-btn" style="background:rgba(33,150,243,.1);color:var(--b2)" onclick="shareTG(scholar?.name_fr||'')"><span>✈️</span><span>Telegram</span></button>

</div>

<div id="audio-bar">
  <div class="ap-thumb">🎧</div>
  <div class="ap-info"><div class="ap-title" id="ap-title">—</div><div class="ap-author" id="ap-author">—</div></div>

    <button class="ap-btn" onclick="AP.seek({offsetX:0})">⏮</button>

  </div>

    <div class="ap-bar" id="ap-bar" onclick="AP.seek(event)"><div class="ap-fill" id="ap-fill"></div></div>
    <div class="ap-times"><span id="ap-cur">0:00</span><span id="ap-dur">—</span></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
let scholar = null;
let favs = JSON.parse(localStorage.getItem('ab_sc_favs')||'{}');
let notifs = JSON.parse(localStorage.getItem('ab_notifs')||'{}');
let followed = JSON.parse(localStorage.getItem('ab_follows')||'{}');

function init() {
  const id = getParam('id') || 'fawzan';
  scholar = SCHOLARS.find(s => s.id === id) || SCHOLARS[0];
  renderHero();
  renderContent();
  renderRelated();
}

function renderHero() {
  const s = scholar;
  document.title = s.name_fr + ' — Al Basîrah';
  document.querySelectorAll('.breadcrumb-name').forEach(el => el.textContent = s.name_fr);
  const idx = SCHOLARS.indexOf(s);
  const av = document.getElementById('sc-av');
  av.textContent = s.init;
  av.style.background = avColor(idx);
  if (s.live) {
    av.innerHTML = s.init + `<div class="live-pip"><div class="live-dot"></div>LIVE</div>`;
  }
  document.getElementById('sc-name-ar').textContent = s.name_ar;
  document.getElementById('sc-name-fr').textContent = s.name_fr;
  document.getElementById('sc-meta').innerHTML = `
    <span class="sc-meta-item">🌍 ${s.country}</span>
    <span class="sc-meta-item">🕰 ${s.era}</span>
    <span class="sc-meta-item">🏷 ${s.cat === 'contemporain' ? 'Contemporain' : s.cat === 'ancien' ? 'Savant ancien' : s.cat === 'rapporteur' ? 'Rapporteur Hadith' : 'Hadith'}</span>`;
  document.getElementById('sc-tags').innerHTML = s.tags.map(t => `<span class="badge badge-green">${t}</span>`).join('');

  // Stats
  document.getElementById('sc-stats').innerHTML = `
    ${s.books ? `<div class="sc-stat"><span class="sc-stat-n" style="color:var(--g1)">${s.books}</span><span class="sc-stat-l">📚 Livres</span></div>` : ''}
    ${s.audios ? `<div class="sc-stat"><span class="sc-stat-n" style="color:var(--b1)">${s.audios}</span><span class="sc-stat-l">🎧 Cours</span></div>` : ''}
    ${s.videos ? `<div class="sc-stat"><span class="sc-stat-n" style="color:var(--r1)">${s.videos}</span><span class="sc-stat-l">🎬 Vidéos</span></div>` : ''}`;

  // Actions
  const isFav = favs[s.id];
  const isFollowed = followed[s.id];
  document.getElementById('sc-actions').innerHTML = `
    <button class="btn btn-green" id="btn-follow" onclick="toggleFollow()">${isFollowed ? '✅ Suivi' : '➕ Suivre'}</button>
    ${s.live ? `<button class="btn btn-red" onclick="location.href='live.html'">📡 Rejoindre le Live</button>` : ''}
    <button class="btn btn-blue" onclick="activateTab('panel-audio',document.querySelector('[onclick*=panel-audio]'),'active-blue');scrollContent()">🎧 Ses cours audio</button>
    <button class="btn btn-green" onclick="activateTab('panel-books',document.querySelector('[onclick*=panel-books]'),'active-green');scrollContent()">📚 Ses livres</button>
    <button class="btn ${isFav ? 'btn-red' : 'btn-ghost'}" id="btn-fav" onclick="toggleFav()">
      ${isFav ? '❤️ Favoris' : '🤍 Ajouter aux favoris'}
    </button>
    <button class="btn btn-ghost" onclick="copyLink()">🔗 Partager</button>`;

  // Bio
  const bio = SCHOLAR_BIOS[s.id] || `Biographie de ${s.name_fr} non disponible.`;
  document.getElementById('bio-short').textContent = bio.substring(0,180) + (bio.length>180?'…':'');
  document.getElementById('bio-text').innerHTML = `<p>${bio}</p>`;
}

function renderContent() {
  const content = getScholarContent(scholar.id);
  document.getElementById('tcnt-books').textContent = content.books.length;
  document.getElementById('tcnt-audio').textContent = content.audios.length;
  document.getElementById('tcnt-video').textContent = content.videos.length;

  // Books
  document.getElementById('books-list').innerHTML = content.books.map(b => `
    <div class="item-row" data-title="${b.title.toLowerCase()}">
      <div class="item-thumb th-green">${b.emoji}</div>
      <div class="item-info">
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem">
          <span class="badge badge-green">${b.cat}</span>
          ${b.isnew ? '<span class="badge badge-red">NOUVEAU</span>' : ''}
        </div>
        <p class="item-title">${b.title}</p>
        <div class="item-meta"><span>📄 ${b.pages} pages</span><span>↓ ${fmtNum(b.dl)} téléch.</span></div>
        <p style="font-size:.76rem;color:var(--muted);margin:.4rem 0 .6rem;line-height:1.6">${b.desc||''}</p>
        <div class="item-actions">
          <button class="btn btn-green btn-sm" onclick="showToast('↓ Téléchargement : ${safeStr(b.title)}')">↓ Télécharger PDF</button>
          <button class="btn btn-ghost btn-sm" onclick="showToast('👁 Aperçu PDF : ${safeStr(b.title)}')">👁 Aperçu</button>
          <button class="btn btn-ghost btn-sm" onclick="shareWA('${safeStr(b.title)}')">WA</button>
          <button class="btn btn-ghost btn-sm" onclick="toggleItemFav('b${b.id}',this)">🤍</button>
        </div>
      </div>
    </div>`).join('');

  // Audio
  document.getElementById('audio-list').innerHTML = content.audios.map(a => `
    <div class="item-row" id="arow-${a.id}" data-title="${a.title.toLowerCase()}">
      <div class="item-thumb th-blue">${a.emoji}</div>
      <div class="item-info">
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem">
          <span class="badge badge-blue">${a.cat}</span>
          <div class="sound-wave"><div class="wave-b"></div><div class="wave-b"></div><div class="wave-b"></div><div class="wave-b"></div></div>
        </div>
        <p class="item-title">${a.title}</p>
        <div class="item-meta"><span>🎵 ${a.eps} ép.</span><span>⏱ ${a.dur}</span><span>▶ ${fmtNum(a.plays)}</span></div>
        <div class="item-actions">
          <button class="btn btn-blue btn-sm" id="abtn-${a.id}" onclick="playAudio(${a.id},'${safeStr(a.title)}',this)">▶ Écouter</button>
          <button class="btn btn-ghost btn-sm" onclick="showToast('↓ Téléchargement audio…')">↓</button>
          <button class="btn btn-ghost btn-sm" onclick="shareWA('${safeStr(a.title)}')">WA</button>
          <button class="btn btn-ghost btn-sm" onclick="toggleItemFav('a${a.id}',this)">🤍</button>
        </div>
      </div>
    </div>`).join('');

  // Videos
  document.getElementById('video-list').innerHTML = content.videos.map(v => `
    <div class="item-row" data-title="${v.title.toLowerCase()}">
      <div class="item-thumb th-red">${v.emoji}</div>
      <div class="item-info">
        <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.3rem">
          <span class="badge badge-red">${v.cat}</span>
        </div>
        <p class="item-title">${v.title}</p>
        <div class="item-meta"><span>⏱ ${v.dur}</span><span>👁 ${fmtNum(v.views)}</span></div>
        <div class="item-actions">
          <button class="btn btn-red btn-sm" onclick="openVideo('${safeStr(v.title)}','${safeStr(scholar.name_fr)}','${v.dur}',${v.views})">▶ Regarder</button>
          <button class="btn btn-ghost btn-sm" onclick="showToast('↓ Téléchargement vidéo…')">↓</button>
          <button class="btn btn-ghost btn-sm" onclick="shareWA('${safeStr(v.title)}')">WA</button>
          <button class="btn btn-ghost btn-sm" onclick="toggleItemFav('v${v.id}',this)">🤍</button>
        </div>
      </div>
    </div>`).join('');
}

function renderRelated() {
  const others = SCHOLARS.filter(s => s.id !== scholar.id && s.cat === scholar.cat).slice(0,4);
  document.getElementById('related-list').innerHTML = others.map((s,i) => `
    <div class="rel-item" onclick="location.href='savant.html?id=${s.id}'">
      <div class="rel-av" style="background:${avColor(i)}">${s.init}</div>
      <div><div class="rel-name">${s.name_fr.split(' ').slice(0,3).join(' ')}</div><div class="rel-sub">${s.tags[0]||''} · ${s.era}</div></div>
    </div>`).join('');
}

// ── AUDIO PLAY/PAUSE ──
let currentAudioId = null;
function playAudio(id, title, btn) {
  if (currentAudioId === id && AP.playing) {
    AP.pause();
    btn.textContent = '▶ Écouter';
    document.getElementById('arow-'+id)?.classList.remove('playing');
    return;
  }
  if (currentAudioId && currentAudioId !== id) {
    document.getElementById('abtn-'+currentAudioId).textContent = '▶ Écouter';
    document.getElementById('arow-'+currentAudioId)?.classList.remove('playing');
  }
  currentAudioId = id;
  AP.load(title, scholar.name_fr, id);
  btn.textContent = '⏸ Pause';
  document.getElementById('arow-'+id)?.classList.add('playing');
}

// ── VIDEO ──
function openVideo(title, author, dur, views) {
  document.getElementById('vm-title').textContent = title;
  document.getElementById('vm-meta').textContent = `👨‍🏫 ${author} · ⏱ ${dur} · 👁 ${fmtNum(views)} vues`;
  document.getElementById('vm-desc').textContent = 'Cours en vidéo HD. Cliquez sur l\'écran pour lancer la lecture.';
  document.getElementById('video-modal').classList.add('open');
}
function closeVideo() { document.getElementById('video-modal').classList.remove('open'); }

// ── FILTER ──
function filterList(listId, q) {
  document.querySelectorAll(`#${listId} .item-row`).forEach(row => {
    row.style.display = row.dataset.title.includes(q.toLowerCase()) ? '' : 'none';
  });
}

// ── FOLLOW / FAV ──
function toggleFollow() {
  followed[scholar.id] = !followed[scholar.id];
  localStorage.setItem('ab_follows', JSON.stringify(followed));
  document.getElementById('btn-follow').textContent = followed[scholar.id] ? '✅ Suivi' : '➕ Suivre';
  showToast(followed[scholar.id] ? '✅ Vous suivez ce savant' : '❌ Suivi retiré');
}
function toggleFav() {
  favs[scholar.id] = !favs[scholar.id];
  localStorage.setItem('ab_sc_favs', JSON.stringify(favs));
  const btn = document.getElementById('btn-fav');
  btn.className = favs[scholar.id] ? 'btn btn-red' : 'btn btn-ghost';
  btn.textContent = favs[scholar.id] ? '❤️ Favoris' : '🤍 Ajouter aux favoris';
  showToast(favs[scholar.id] ? '❤️ Ajouté aux favoris !' : '💔 Retiré des favoris');
}
function toggleItemFav(key, btn) {
  const f = JSON.parse(localStorage.getItem('ab_item_favs')||'{}');
  f[key] = !f[key];
  localStorage.setItem('ab_item_favs', JSON.stringify(f));
  btn.textContent = f[key] ? '❤️' : '🤍';
  btn.className = f[key] ? 'btn btn-red btn-sm' : 'btn btn-ghost btn-sm';
  showToast(f[key] ? '❤️ Ajouté aux favoris' : '💔 Retiré');
}
function toggleNotif() {
  notifs[scholar.id] = !notifs[scholar.id];
  localStorage.setItem('ab_notifs', JSON.stringify(notifs));
  const btn = document.getElementById('notif-btn');
  btn.textContent = notifs[scholar.id] ? '✅ Notifications activées' : '🔔 Activer les notifications';
  btn.className = notifs[scholar.id] ? 'btn btn-ghost btn-block' : 'btn btn-green btn-block';
  showToast(notifs[scholar.id] ? '🔔 Notifications activées !' : '🔕 Notifications désactivées');
}
function scrollContent() {
  document.querySelector('.content-box').scrollIntoView({behavior:'smooth',block:'start'});
}

// ── CLOSE MODAL ON BG CLICK ──
document.getElementById('video-modal').addEventListener('click', e => { if (e.target.id === 'video-modal') closeVideo(); });

init();
</script>
</body>
