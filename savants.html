<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Savants — Al Basîrah</title>
<link rel="stylesheet" href="style.css"/>
<style>
.page-hero{padding:100px 5vw 40px;background:linear-gradient(160deg,#FAFFFE,#F4FBFF);border-bottom:1.5px solid var(--line);}
.ph-title{font-size:2rem;font-weight:900;color:var(--txt);margin-bottom:.4rem;}
.ph-sub{font-size:.9rem;font-weight:600;color:var(--muted);}
.sc-card{background:var(--white);border-radius:var(--r-xl);border:1.5px solid var(--line);
  box-shadow:var(--sh);padding:1.6rem 1.2rem;text-align:center;
  cursor:pointer;transition:all .25s;position:relative;overflow:hidden;}
.sc-card:hover{transform:translateY(-5px);box-shadow:var(--sh-h);}
.sc-av{width:72px;height:72px;border-radius:50%;margin:0 auto .9rem;
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Naskh Arabic',serif;font-size:1.8rem;font-weight:700;color:#fff;}
.sc-nar{font-family:'Noto Naskh Arabic',serif;font-size:.95rem;font-weight:700;color:var(--txt);margin-bottom:.2rem;}
.sc-nfr{font-size:.75rem;font-weight:600;color:var(--muted);margin-bottom:.3rem;}
.sc-country{font-size:.67rem;color:var(--muted);margin-bottom:.6rem;}
.sc-tags{display:flex;flex-wrap:wrap;gap:.3rem;justify-content:center;margin-bottom:.6rem;}
.sc-counts{display:flex;gap:.35rem;justify-content:center;margin-bottom:.8rem;flex-wrap:wrap;}
.sc-btn{width:100%;font-size:.77rem;font-weight:800;border:none;border-radius:var(--r-md);
  padding:.6rem;background:var(--g1);color:#fff;cursor:pointer;transition:all .2s;box-shadow:0 3px 10px rgba(29,185,84,.25);}
.sc-btn:hover{background:var(--g2);transform:translateY(-1px);}
.sc-live-tag{position:absolute;top:.7rem;right:.7rem;}
.count-badge{font-size:.8rem;font-weight:800;padding:.2rem .7rem;border-radius:20px;background:var(--bg);color:var(--muted);}
</style>
</head>
<body>
<div id="toast"></div>
<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">ب</div>
    <div class="nav-logo-text"><span class="nav-logo-ar">البصيرة</span><span class="nav-logo-fr">Al Basîrah</span></div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">🏠 Accueil</a></li>
    <li><a href="savants.html" class="active">👨‍🏫 Savants</a></li>
    <li><a href="bibliotheque.html">📚 Bibliothèque</a></li>
    <li><a href="live.html">📡 En Direct</a></li>
    <li><a href="categories.html">🏷️ Catégories</a></li>
  </ul>
  <div class="nav-right">
    <button class="btn btn-outline" onclick="location.href='connexion.html'">Connexion</button>
    <button class="btn btn-green" onclick="location.href='inscription.html'">S'inscrire</button>
  </div>
</nav>

<div class="page-hero">
  <div class="page-wrap">
    <div style="font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:.8rem"><a href="index.html" style="color:var(--b1)">🏠 Accueil</a> › Savants</div>
    <h1 class="ph-title">👨‍🏫 Les <span style="color:var(--g1)">Savants</span></h1>
    <p class="ph-sub">Anciens · Contemporains · Rapporteurs de Hadith — Cliquez sur un savant pour voir tous ses cours</p>
  </div>
</div>

<div style="background:var(--white);padding:1.2rem 5vw;border-bottom:1.5px solid var(--line);position:sticky;top:62px;z-index:100">
  <div class="page-wrap" style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap">
    <div class="search-box" style="flex:1;max-width:320px">
      <span class="search-ico">🔍</span>
      <input type="text" placeholder="Rechercher un savant…" id="sc-search" oninput="searchScholars(this.value)"/>
    </div>
    <div class="filter-chips" style="margin:0" id="sc-filters">
      <button class="chip active" onclick="filterScholars('all',this)">🌐 Tous <span class="count-badge" id="cnt-all"></span></button>
      <button class="chip" onclick="filterScholars('contemporain',this)">🕌 Contemporains</button>
      <button class="chip" onclick="filterScholars('ancien',this)">📜 Anciens</button>
      <button class="chip" onclick="filterScholars('hadith',this)">📿 Hadith</button>
      <button class="chip" onclick="filterScholars('rapporteur',this)">📖 Rapporteurs</button>
    </div>
    <span style="font-size:.8rem;font-weight:700;color:var(--muted)"><span id="sc-count">0</span> savants</span>
  </div>
</div>

<div style="padding:2.5rem 5vw 4rem">
  <div class="page-wrap">
    <div class="grid-4" id="scholars-grid"></div>
  </div>
</div>

<div id="audio-bar">
  <div class="ap-thumb">🎧</div>
  <div class="ap-info"><div class="ap-title" id="ap-title">—</div><div class="ap-author" id="ap-author">—</div></div>
  <div class="ap-controls">
    <button class="ap-btn" onclick="AP.seek({offsetX:0})">⏮</button>
    <button class="ap-btn play" id="ap-play" onclick="AP.toggle()">▶</button>
    <button class="ap-btn" onclick="AP.close()">⏭</button>
  </div>
  <div class="ap-progress">
    <div class="ap-bar" id="ap-bar" onclick="AP.seek(event)"><div class="ap-fill" id="ap-fill"></div></div>
    <div class="ap-times"><span id="ap-cur">0:00</span><span id="ap-dur">—</span></div>
  </div>
  <button class="ap-close" onclick="AP.close()">✕</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
let allScholars = [...SCHOLARS];
let filtered = [...SCHOLARS];

function renderScholars(list) {
  document.getElementById('sc-count').textContent = list.length;
  if (!list.length) {
    document.getElementById('scholars-grid').innerHTML = `<div class="empty-state" style="grid-column:1/-1"><span class="empty-ico">🔍</span><h3>Aucun savant trouvé</h3><p>Essayez d'autres termes</p></div>`;
    return;
  }
  document.getElementById('scholars-grid').innerHTML = list.map((s, i) => {
    const livePill = s.live ? `<div class="sc-live-tag"><span class="live-badge"><div class="live-dot"></div>LIVE</span></div>` : '';
    const tags = s.tags.slice(0,2).map(t => `<span class="badge badge-green">${t}</span>`).join('');
    return `<div class="sc-card" style="border-top:3px solid ${avColor(i).includes('1DB954')?'var(--g1)':avColor(i).includes('2196')?'var(--b1)':avColor(i).includes('E539')?'var(--r1)':'var(--c1)'}">
      ${livePill}
      <div class="sc-av" style="background:${avColor(i)}">${s.init}</div>
      <p class="sc-nar">${s.name_ar}</p>
      <p class="sc-nfr">${s.name_fr}</p>
      <p class="sc-country">🌍 ${s.country} · ${s.era}</p>
      <div class="sc-tags">${tags}</div>
      <div class="sc-counts">
        ${s.books?`<span class="badge badge-green">📚 ${s.books}</span>`:''}
        ${s.audios?`<span class="badge badge-blue">🎧 ${s.audios}</span>`:''}
        ${s.videos?`<span class="badge badge-red">🎬 ${s.videos}</span>`:''}
      </div>
      <button class="sc-btn" onclick="location.href='savant.html?id=${s.id}'">Voir ses cours →</button>
    </div>`;
  }).join('');
}

function filterScholars(cat, btn) {
  document.querySelectorAll('#sc-filters .chip').forEach(c => c.classList.remove('active'));
  btn.classList.add('active');
  const q = document.getElementById('sc-search').value.toLowerCase();
  filtered = (cat === 'all' ? allScholars : allScholars.filter(s => s.cat === cat))
    .filter(s => !q || s.name_fr.toLowerCase().includes(q) || s.name_ar.includes(q));
  renderScholars(filtered);
}

function searchScholars(q) {
  const activeBtn = document.querySelector('#sc-filters .chip.active');
  if (activeBtn) filterScholars(activeBtn.dataset.cat || 'all', activeBtn);
  else {
    filtered = allScholars.filter(s => s.name_fr.toLowerCase().includes(q.toLowerCase()) || s.name_ar.includes(q));
    renderScholars(filtered);
  }
}

document.getElementById('cnt-all').textContent = SCHOLARS.length;
document.querySelectorAll('#sc-filters .chip').forEach(btn => {
  const txt = btn.textContent.trim();
  if (txt.includes('Contemporains')) btn.dataset.cat = 'contemporain';
  else if (txt.includes('Anciens')) btn.dataset.cat = 'ancien';
  else if (txt.includes('Hadith')) btn.dataset.cat = 'hadith';
  else if (txt.includes('Rapporteurs')) btn.dataset.cat = 'rapporteur';
  else btn.dataset.cat = 'all';
});

renderScholars(allScholars);
initReveal();
</script>
</body>
</html>
