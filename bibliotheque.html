<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Bibliothèque — Al Basîrah</title>
<link rel="stylesheet" href="style.css"/>
<style>
.lib-layout{display:grid;grid-template-columns:240px 1fr;gap:1.8rem;align-items:start;max-width:1240px;margin:2rem auto;padding:0 5vw;}
.sidebar-sticky{position:sticky;top:80px;}
.filter-box{background:var(--white);border-radius:var(--r-xl);border:1.5px solid var(--line);overflow:hidden;margin-bottom:1.1rem;}
.filter-head{background:var(--bg);padding:.75rem 1.1rem;font-size:.68rem;font-weight:800;letter-spacing:.18em;text-transform:uppercase;border-bottom:1.5px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
.filter-body{padding:.9rem 1.1rem;}
.filter-item{display:flex;align-items:center;gap:.6rem;padding:.45rem .3rem;border-radius:var(--r-sm);cursor:pointer;transition:background .15s;}
.filter-item:hover{background:var(--bg);}
.filter-item input[type=checkbox]{accent-color:var(--g1);width:15px;height:15px;cursor:pointer;flex-shrink:0;}
.filter-item label{font-size:.8rem;font-weight:700;color:var(--sub);cursor:pointer;flex:1;}
.filter-clear{font-size:.68rem;font-weight:800;color:var(--r1);background:none;border:none;cursor:pointer;padding:.15rem .4rem;border-radius:4px;}
.filter-clear:hover{background:rgba(229,57,53,.08);}

.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.1rem;}
.item-card{background:var(--white);border-radius:var(--r-xl);border:1.5px solid var(--line);overflow:hidden;cursor:pointer;transition:all .22s;}
.item-card:hover{transform:translateY(-4px);box-shadow:var(--sh-h);}
.ic-cover{height:130px;display:flex;align-items:center;justify-content:center;font-size:2.5rem;position:relative;}
.cov-books{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);}
.cov-audio{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);}
.cov-video{background:linear-gradient(135deg,#FFEBEE,#FFCDD2);}
.ic-cover-top{position:absolute;top:0;left:0;right:0;height:3px;}
.ic-badge-cover{position:absolute;top:.6rem;left:.6rem;}
.ic-fav-btn{position:absolute;top:.5rem;right:.5rem;width:28px;height:28px;border-radius:50%;background:var(--white);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.8rem;box-shadow:0 1px 6px rgba(0,0,0,.1);transition:all .18s;}
.ic-fav-btn:hover{transform:scale(1.15);}
.ic-body{padding:1rem;}
.ic-cat{font-size:.64rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;display:block;margin-bottom:.4rem;}
.ic-title{font-size:.88rem;font-weight:800;color:var(--txt);line-height:1.38;margin-bottom:.3rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.ic-author{font-size:.73rem;font-weight:600;color:var(--muted);margin-bottom:.55rem;}
.ic-meta{display:flex;gap:.7rem;font-size:.69rem;font-weight:700;color:var(--muted);margin-bottom:.8rem;}
.ic-btns{display:flex;gap:.5rem;}

.toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.8rem;margin-bottom:1.3rem;}
.toolbar-left{display:flex;align-items:center;gap:.8rem;flex-wrap:wrap;}
.result-count{font-size:.8rem;font-weight:700;color:var(--muted);}
.result-count strong{color:var(--b1);}
select.sort-sel{font-family:'Nunito',sans-serif;font-size:.78rem;font-weight:700;background:var(--white);border:1.5px solid var(--line);border-radius:var(--r-md);padding:.4rem .8rem;cursor:pointer;outline:none;color:var(--sub);}
select.sort-sel:focus{border-color:var(--b1);}
.view-btns{display:flex;gap:.3rem;}
.view-btn{width:32px;height:32px;border-radius:var(--r-sm);border:1.5px solid var(--line);background:var(--white);cursor:pointer;font-size:.9rem;transition:all .18s;}
.view-btn.active{background:var(--b1);color:#fff;border-color:var(--b1);}

.list-card{background:var(--white);border-radius:var(--r-lg);border:1.5px solid var(--line);padding:1rem 1.2rem;display:flex;align-items:center;gap:1rem;cursor:pointer;transition:all .2s;margin-bottom:.7rem;}
.list-card:hover{border-color:var(--b1);box-shadow:0 4px 14px rgba(33,150,243,.08);}
.lc-ico{width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
.lc-body{flex:1;min-width:0;}
.lc-top{display:flex;align-items:center;gap:.5rem;margin-bottom:.25rem;}
.lc-title{font-size:.88rem;font-weight:800;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lc-author{font-size:.73rem;font-weight:600;color:var(--muted);}
.lc-meta{font-size:.7rem;font-weight:700;color:var(--muted);}
.lc-actions{display:flex;gap:.5rem;flex-shrink:0;}

@media(max-width:860px){.lib-layout{grid-template-columns:1fr} .sidebar-sticky{position:static}}
@media(max-width:500px){.items-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="toast"></div>

<!-- VIDEO MODAL -->
<div class="modal-overlay" id="video-modal">
  <div class="modal-box">
    <div class="modal-header">
      <p class="modal-title" id="vm-title">—</p>
      <button class="modal-close" onclick="document.getElementById('video-modal').classList.remove('open')">✕</button>
    </div>
    <div class="modal-body">
      <div style="aspect-ratio:16/9;background:var(--dark);border-radius:var(--r-lg);display:flex;align-items:center;justify-content:center;font-size:3rem;cursor:pointer;margin-bottom:1rem" onclick="showToast('▶ Lecture lancée')">🎬</div>
      <p id="vm-meta" style="font-size:.82rem;color:var(--muted);margin-bottom:.9rem;font-weight:700;"></p>
      <div style="display:flex;gap:.6rem;flex-wrap:wrap">
        <button class="btn btn-red" onclick="showToast('▶ Lecture démarrée')">▶ Regarder</button>
        <button class="btn btn-blue" onclick="showToast('↓ Téléchargement…')">↓ Télécharger</button>
        <button class="btn btn-ghost" onclick="copyLink()">🔗 Partager</button>
      </div>
    </div>
  </div>
</div>

<nav class="navbar">
  <a href="index.html" class="nav-logo">
    <div class="nav-logo-icon">ب</div>
    <div class="nav-logo-text"><span class="nav-logo-ar">البصيرة</span><span class="nav-logo-fr">Al Basîrah</span></div>
  </a>
  <ul class="nav-links">
    <li><a href="index.html">🏠 Accueil</a></li>
    <li><a href="savants.html">👨‍🏫 Savants</a></li>
    <li><a href="bibliotheque.html" class="active">📚 Bibliothèque</a></li>
    <li><a href="live.html">📡 En Direct</a></li>
    <li><a href="categories.html">🏷️ Catégories</a></li>
  </ul>
  <div class="nav-right">
    <button class="btn btn-outline" onclick="location.href='connexion.html'">Connexion</button>
    <button class="btn btn-green" onclick="location.href='inscription.html'">S'inscrire</button>
  </div>
</nav>

<div style="background:var(--white);border-bottom:1.5px solid var(--line);padding:90px 5vw 1.2rem;">
  <div class="page-wrap">
    <div style="font-size:.7rem;font-weight:700;color:var(--muted);margin-bottom:.8rem"><a href="index.html" style="color:var(--b1)">🏠 Accueil</a> › Bibliothèque</div>
    <h1 style="font-size:1.8rem;font-weight:900;color:var(--txt);margin-bottom:.4rem">📚 Bibliothèque <span style="color:var(--b1)">Numérique</span></h1>
    <div class="tabs-nav" style="margin-top:1.2rem" data-tabs>
      <button class="tab-btn active-green" onclick="switchType('books',this)">📚 Livres <span class="tab-cnt" id="tcnt-books">12</span></button>
      <button class="tab-btn" onclick="switchType('audio',this)">🎧 Audio <span class="tab-cnt" id="tcnt-audio">8</span></button>
      <button class="tab-btn" onclick="switchType('video',this)">🎬 Vidéos <span class="tab-cnt" id="tcnt-video">8</span></button>
    </div>
  </div>
</div>

<div class="lib-layout">
  <!-- SIDEBAR -->
  <aside class="sidebar-sticky">
    <div class="filter-box">
      <div class="filter-head" style="color:var(--g2)">🔍 Recherche</div>
      <div class="filter-body">
        <div class="search-box"><span class="search-ico">🔍</span><input type="text" id="search-inp" placeholder="Titre, auteur…" oninput="applyFilters()"/></div>
      </div>
    </div>
    <div class="filter-box">
      <div class="filter-head" style="color:var(--b2)">🏷 Catégorie <button class="filter-clear" onclick="clearCat()">Effacer</button></div>
      <div class="filter-body" id="cat-filters"></div>
    </div>
    <div class="filter-box">
      <div class="filter-head" style="color:var(--g2)">👨‍🏫 Savant <button class="filter-clear" onclick="clearSch()">Effacer</button></div>
      <div class="filter-body" id="scholar-filters"></div>
    </div>
  </aside>

  <!-- CONTENT -->
  <div>
    <div class="toolbar">
      <div class="toolbar-left">
        <span class="result-count"><strong id="result-count">0</strong> résultats</span>
        <select class="sort-sel" id="sort-sel" onchange="applyFilters()">
          <option value="recent">Plus récent</option>
          <option value="popular">Plus populaire</option>
          <option value="az">A → Z</option>
          <option value="za">Z → A</option>
        </select>
      </div>
      <div class="view-btns">
        <button class="view-btn active" id="vbtn-grid" onclick="setView('grid')" title="Grille">⊞</button>
        <button class="view-btn" id="vbtn-list" onclick="setView('list')" title="Liste">☰</button>
      </div>
    </div>
    <div id="items-container"></div>
    <div id="load-more-wrap" style="text-align:center;margin-top:1.5rem;display:none">
      <button class="btn btn-outline btn-lg" onclick="loadMore()">Charger plus <span id="more-count"></span></button>
    </div>
  </div>
</div>

<div id="audio-bar">
  <div class="ap-thumb">🎧</div>
  <div class="ap-info"><div class="ap-title" id="ap-title">—</div><div class="ap-author" id="ap-author">—</div></div>
  <div class="ap-controls">
    <button class="ap-btn" onclick="AP.seek({offsetX:0})">⏮</button>
    <button class="ap-btn play" id="ap-play" onclick="AP.toggle()">▶</button>
    <button class="ap-btn" onclick="AP.close()">⏭</button>
  </div>
  <div class="ap-progress">
    <div class="ap-bar" id="ap-bar" onclick="AP.seek(event)"><div class="ap-fill" id="ap-fill"></div></div>
    <div class="ap-times"><span id="ap-cur">0:00</span><span id="ap-dur">—</span></div>
  </div>
  <button class="ap-close" onclick="AP.close()">✕</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
let currentType = 'books';
let viewMode = 'grid';
let itemFavs = JSON.parse(localStorage.getItem('ab_item_favs')||'{}');
let page = 0;
const PAGE_SIZE = 12;
let allItems = [];
let filtered = [];

function getAllData(type) {
  if (type === 'books') return BOOKS_DATA;
  if (type === 'audio') return AUDIOS_DATA;
  return VIDEOS_DATA;
}

function getUnique(arr, key) {
  return [...new Set(arr.map(i => i[key]).filter(Boolean))];
}

function switchType(type, btn) {
  currentType = type;
  document.querySelectorAll('.tabs-nav .tab-btn').forEach(b => b.className = 'tab-btn');
  const colorClass = type === 'books' ? 'active-green' : type === 'audio' ? 'active-blue' : 'active-red';
  btn.classList.add(colorClass);
  allItems = getAllData(type);
  buildFilters();
  page = 0;
  applyFilters();
  // Handle URL param
  const url = new URL(location.href);
  url.searchParams.set('type', type);
  history.replaceState({}, '', url);
}

function buildFilters() {
  const cats = getUnique(allItems, 'cat');
  document.getElementById('cat-filters').innerHTML = cats.map(c => `
    <div class="filter-item">
      <input type="checkbox" id="cat-${c}" value="${c}" onchange="applyFilters()"/>
      <label for="cat-${c}">${c}</label>
    </div>`).join('');
  const authors = getUnique(allItems, 'author');
  document.getElementById('scholar-filters').innerHTML = authors.slice(0,8).map(a => `
    <div class="filter-item">
      <input type="checkbox" id="sch-${a.replace(/[^a-z]/gi,'_')}" value="${a}" onchange="applyFilters()"/>
      <label for="sch-${a.replace(/[^a-z]/gi,'_')}" style="font-size:.76rem">${a.split(' ').slice(0,3).join(' ')}</label>
    </div>`).join('');
}

function clearCat() {
  document.querySelectorAll('#cat-filters input').forEach(i => i.checked = false);
  applyFilters();
}
function clearSch() {
  document.querySelectorAll('#scholar-filters input').forEach(i => i.checked = false);
  applyFilters();
}

function applyFilters() {
  const q = document.getElementById('search-inp').value.toLowerCase();
  const cats = [...document.querySelectorAll('#cat-filters input:checked')].map(i => i.value);
  const schs = [...document.querySelectorAll('#scholar-filters input:checked')].map(i => i.value);
  const sort = document.getElementById('sort-sel').value;

  filtered = allItems.filter(item => {
    if (q && !item.title.toLowerCase().includes(q) && !(item.author||'').toLowerCase().includes(q)) return false;
    if (cats.length && !cats.includes(item.cat)) return false;
    if (schs.length && !schs.includes(item.author)) return false;
    return true;
  });

  if (sort === 'popular') filtered.sort((a,b) => (b.dl||b.plays||b.views||0) - (a.dl||a.plays||a.views||0));
  else if (sort === 'az') filtered.sort((a,b) => a.title.localeCompare(b.title));
  else if (sort === 'za') filtered.sort((a,b) => b.title.localeCompare(a.title));

  document.getElementById('result-count').textContent = filtered.length;
  document.getElementById('tcnt-books').textContent = currentType==='books'?filtered.length:BOOKS_DATA.length;
  document.getElementById('tcnt-audio').textContent = currentType==='audio'?filtered.length:AUDIOS_DATA.length;
  document.getElementById('tcnt-video').textContent = currentType==='video'?filtered.length:VIDEOS_DATA.length;

  page = 0;
  renderItems(false);
}

function renderItems(append) {
  const container = document.getElementById('items-container');
  const slice = filtered.slice(0, (page + 1) * PAGE_SIZE);
  const remaining = filtered.length - slice.length;

  const html = slice.map(item => viewMode === 'grid' ? renderGridCard(item) : renderListCard(item)).join('');
  container.className = viewMode === 'grid' ? 'items-grid' : '';
  container.innerHTML = html || `<div class="empty-state"><span class="empty-ico">🔍</span><h3>Aucun résultat</h3><p>Essayez d'autres termes ou supprimez les filtres</p></div>`;

  const lmw = document.getElementById('load-more-wrap');
  if (remaining > 0) { lmw.style.display='block'; document.getElementById('more-count').textContent=`(${remaining} restants)`; }
  else lmw.style.display = 'none';
}

function loadMore() { page++; renderItems(false); }

function setView(v) {
  viewMode = v;
  document.getElementById('vbtn-grid').classList.toggle('active', v==='grid');
  document.getElementById('vbtn-list').classList.toggle('active', v==='list');
  renderItems(false);
}

function renderGridCard(item) {
  const isBook = currentType==='books', isAudio = currentType==='audio';
  const covClass = isBook?'cov-books':isAudio?'cov-audio':'cov-video';
  const topColor = isBook?'var(--g1)':isAudio?'var(--b1)':'var(--r1)';
  const catColor = isBook?'badge-green':isAudio?'badge-blue':'badge-red';
  const catTxt = isBook?'#1DB954':isAudio?'#1565C0':'#B71C1C';
  const fk = currentType[0]+item.id;
  const isFav = itemFavs[fk];
  const meta = isBook ? `📄 ${item.pages} p. · ↓ ${fmtNum(item.dl)}` : isAudio ? `🎵 ${item.eps} ép. · ⏱ ${item.dur}` : `⏱ ${item.dur} · 👁 ${fmtNum(item.views)}`;
  const btnHtml = isBook
    ? `<button class="btn btn-green btn-sm" style="flex:1" onclick="event.stopPropagation();showToast('↓ Téléchargement : ${safeStr(item.title)}')">↓ PDF</button>
       <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showToast('👁 Aperçu PDF')">👁</button>`
    : isAudio
    ? `<button class="btn btn-blue btn-sm" style="flex:1" onclick="event.stopPropagation();AP.load('${safeStr(item.title)}','${safeStr(item.author||'')}','${item.id}')">▶ Écouter</button>
       <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showToast('↓ Téléchargement audio…')">↓</button>`
    : `<button class="btn btn-red btn-sm" style="flex:1" onclick="event.stopPropagation();openVideo('${safeStr(item.title)}','${safeStr(item.author||'')}','${item.dur}',${item.views||0})">▶ Voir</button>
       <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showToast('↓ Téléchargement vidéo…')">↓</button>`;
  return `<div class="item-card" onclick="showToast('📄 ${safeStr(item.title)}')">
    <div class="ic-cover ${covClass}">
      <div class="ic-cover-top" style="background:${topColor}"></div>
      <span class="ic-badge-cover badge ${catColor}">${item.cat||'—'}</span>
      <button class="ic-fav-btn" onclick="event.stopPropagation();toggleFav('${fk}',this)">${isFav?'❤️':'🤍'}</button>
      <span>${item.emoji||'📄'}</span>
    </div>
    <div class="ic-body">
      <span class="ic-cat" style="color:${catTxt}">${item.cat||'—'}</span>
      <p class="ic-title">${item.title}</p>
      <p class="ic-author">${item.author||'—'}</p>
      <div class="ic-meta">${meta}</div>
      <div class="ic-btns">${btnHtml}</div>
    </div>
  </div>`;
}

function renderListCard(item) {
  const isBook = currentType==='books', isAudio = currentType==='audio';
  const icoClass = isBook?'cov-books':isAudio?'cov-audio':'cov-video';
  const catColor = isBook?'badge-green':isAudio?'badge-blue':'badge-red';
  const meta = isBook ? `📄 ${item.pages} p. · ↓ ${fmtNum(item.dl)}` : isAudio ? `🎵 ${item.eps} ép. · ⏱ ${item.dur} · ▶ ${fmtNum(item.plays)}` : `⏱ ${item.dur} · 👁 ${fmtNum(item.views)}`;
  const btnHtml = isBook
    ? `<button class="btn btn-green btn-sm" onclick="showToast('↓ Téléchargement…')">↓ PDF</button>`
    : isAudio
    ? `<button class="btn btn-blue btn-sm" onclick="AP.load('${safeStr(item.title)}','${safeStr(item.author||'')}','${item.id}')">▶ Écouter</button>`
    : `<button class="btn btn-red btn-sm" onclick="openVideo('${safeStr(item.title)}','${safeStr(item.author||'')}','${item.dur}',${item.views||0})">▶ Voir</button>`;
  return `<div class="list-card">
    <div class="lc-ico ${icoClass}">${item.emoji||'📄'}</div>
    <div class="lc-body">
      <div class="lc-top"><span class="badge ${catColor}">${item.cat||'—'}</span></div>
      <p class="lc-title">${item.title}</p>
      <p class="lc-author">${item.author||'—'}</p>
      <p class="lc-meta">${meta}</p>
    </div>
    <div class="lc-actions">${btnHtml}<button class="btn btn-ghost btn-sm" onclick="copyLink()">🔗</button></div>
  </div>`;
}

function openVideo(title, author, dur, views) {
  document.getElementById('vm-title').textContent = title;
  document.getElementById('vm-meta').textContent = `👨‍🏫 ${author} · ⏱ ${dur} · 👁 ${fmtNum(views)} vues`;
  document.getElementById('video-modal').classList.add('open');
}
document.getElementById('video-modal').addEventListener('click', e => { if (e.target.id==='video-modal') e.target.classList.remove('open'); });

function toggleFav(key, btn) {
  itemFavs[key] = !itemFavs[key];
  localStorage.setItem('ab_item_favs', JSON.stringify(itemFavs));
  btn.textContent = itemFavs[key] ? '❤️' : '🤍';
  showToast(itemFavs[key] ? '❤️ Ajouté aux favoris' : '💔 Retiré');
}

// Init
const typeParam = getParam('type') || 'books';
allItems = getAllData(typeParam);
const catParam = getParam('cat');
currentType = typeParam;
// Activate correct tab
document.querySelectorAll('.tabs-nav .tab-btn').forEach(btn => {
  const t = btn.getAttribute('onclick')?.match(/switchType\('(\w+)'/)?.[1];
  if (t === typeParam) {
    btn.className = 'tab-btn ' + (typeParam==='books'?'active-green':typeParam==='audio'?'active-blue':'active-red');
  }
});
buildFilters();
if (catParam) {
  const cb = document.querySelector(`#cat-filters input[value="${catParam}"]`);
  if (cb) cb.checked = true;
}
applyFilters();
</script>
</body>
</html>
