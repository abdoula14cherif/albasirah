<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Connexion — Al Basîrah</title>
<link rel="stylesheet" href="style.css"/>
<style>
body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:linear-gradient(160deg,#FAFFFE,#F4FBFF);}
.auth-card{background:var(--white);border-radius:var(--r-xl);border:1.5px solid var(--line);box-shadow:0 8px 40px rgba(0,0,0,.1);padding:2.5rem 2rem;width:100%;max-width:400px;}
.auth-logo{text-align:center;margin-bottom:2rem;}
.auth-logo .nav-logo-icon{width:52px;height:52px;border-radius:15px;font-size:1.4rem;margin:0 auto .6rem;}
.auth-title{font-size:1.4rem;font-weight:900;color:var(--txt);text-align:center;margin-bottom:.3rem;}
.auth-sub{font-size:.83rem;font-weight:600;color:var(--muted);text-align:center;margin-bottom:1.8rem;}
.form-group{margin-bottom:1.2rem;}
.form-label{font-size:.78rem;font-weight:800;color:var(--sub);display:block;margin-bottom:.4rem;}
.form-input{width:100%;font-family:'Nunito',sans-serif;font-size:.9rem;font-weight:600;color:var(--txt);background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-md);padding:.65rem 1rem;outline:none;transition:border-color .18s;}
.form-input:focus{border-color:var(--g1);background:var(--white);box-shadow:0 0 0 3px rgba(29,185,84,.08);}
.auth-btn{width:100%;padding:.75rem;font-size:.92rem;font-weight:800;margin-top:.5rem;}
.auth-link{text-align:center;margin-top:1.2rem;font-size:.8rem;font-weight:600;color:var(--muted);}
.auth-link a{color:var(--g1);font-weight:800;}
.auth-divider{display:flex;align-items:center;gap:.8rem;margin:1.2rem 0;color:var(--muted);font-size:.75rem;font-weight:700;}
.auth-divider::before,.auth-divider::after{content:'';flex:1;height:1px;background:var(--line);}
</style>
</head>
<body>
<div id="toast"></div>
<div class="auth-card">
  <div class="auth-logo">
    <div class="nav-logo-icon" style="display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#1DB954,#2196F3);">
      <span style="font-family:'Noto Naskh Arabic',serif;color:#fff;font-weight:700;font-size:1.4rem">ب</span>
    </div>
    <div style="font-family:'Noto Naskh Arabic',serif;font-size:1.1rem;font-weight:700;color:var(--g2)">البصيرة</div>
  </div>
  <h1 class="auth-title">Connexion</h1>
  <p class="auth-sub">Accédez à votre espace Al Basîrah</p>
  <form onsubmit="handleLogin(event)">
    <div class="form-group">
      <label class="form-label">Adresse email</label>
      <input type="email" class="form-input" id="login-email" placeholder="votre@email.com" required/>
    </div>
    <div class="form-group">
      <label class="form-label">Mot de passe</label>
      <input type="password" class="form-input" id="login-pwd" placeholder="••••••••" required/>
    </div>
    <button type="submit" class="btn btn-green auth-btn">🔐 Se connecter</button>
  </form>
  <div class="auth-divider">ou</div>
  <button class="btn btn-ghost auth-btn" onclick="showToast('📧 Connexion Google…')">🌐 Continuer avec Google</button>
  <div class="auth-link">Pas encore de compte ? <a href="inscription.html">S'inscrire →</a></div>
  <div class="auth-link" style="margin-top:.5rem"><a href="index.html" style="color:var(--muted)">← Retour à l'accueil</a></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
async function handleLogin(e) {
  e.preventDefault();
  const email = document.getElementById('login-email').value;
  const pwd = document.getElementById('login-pwd').value;
  const btn = e.target.querySelector('button[type=submit]');
  btn.textContent = '⏳ Connexion…'; btn.disabled = true;
  try {
    const db = getDB();
    if (db) {
      const { data, error } = await db.auth.signInWithPassword({ email, password: pwd });
      if (error) throw error;
      showToast('✅ Connecté !');
      setTimeout(() => location.href = 'index.html', 800);
    } else {
      showToast('✅ Connecté ! (mode démo)');
      setTimeout(() => location.href = 'index.html', 800);
    }
  } catch(err) {
    showToast('❌ ' + (err.message || 'Erreur de connexion'));
    btn.textContent = '🔐 Se connecter'; btn.disabled = false;
  }
}
</script>
</body>
</html>
